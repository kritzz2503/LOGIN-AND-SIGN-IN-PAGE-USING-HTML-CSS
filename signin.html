<html>
<body>
    <style>
        body{
            background:linear-gradient(to right,rgb(15, 54, 15),rgb(184, 184, 22));
            justify-content:center;
            align-items:center;
            height:90vh;
            width:90vw;
            display:flex;
        }
        form{
            height:90%;
            width:50%;
            box-shadow:5px 5px 5px 5px rgb(220, 217, 163);
            background:linear-gradient(225,225,225,0.7);
            display:flex;
            flex-direction:column;
            border-radius:5px;
        }
        h1{
            font:sitka small;
            font-size:30px;
            text-align:center;
            color:rgba(225,225,225,0.8);
        }
        label{
            font:sitka small;
            font-size:18px;
            margin-left:15px;
            margin-bottom:10px;
            color:rgba(225,225,225,0.8);
        }
        input{
            width:90%;
            margin-left:15px;
            margin-bottom:20px;
            border:none;
            outline:none;
            background:transparent;
            color:white;
            border-bottom:1px solid rgba(225,225,225,0.8)
        }
        .button1{
            height:30px;
            width:30%;
            font:sitka small;
            font-size:15px;
            font-width:bold;
            background:rgba(225,225,225,0.8);
            opacity:20px;
            border:none;
            margin-bottom:10px;
            margin-left:15px;
            box-shadow:0px 10px 10px rgb(91, 88, 88);
        }
        .button2{
            height:30px;
            width:30%;
            font:sitka small;
            font-size:15px;
            font-width:bold;
            background:rgba(225,225,225,0.8);
            opacity:20px;
            border:none;
            margin-bottom:25px;
            box-shadow:0px 10px 10px rgb(91, 88, 88);
        }
        .button1:hover{
            background-color:grey;
            color:black;
        }
        .button1:active{
            background-color:white;
            color:black;
        }
        .button2:hover{
            background-color:grey;
            color:black;
        }
        .button2:active{
            background-color:white;
            color:black;
        }
        
    </style>
    <form>
        <h1>SIGN IN</h1>
        <label>USERNAME</label>
        <input type="text">
        <label>PASSWORD</label>
        <input type="text">
        <div style="display:flex;
            flex-direction:row;gap:120px;">
        <button class="button1">SIGN IN</button>
        <button class="button2">Cancel</button>
        </div>
    </form>
</body>
